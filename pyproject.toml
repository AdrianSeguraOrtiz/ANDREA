[project]
name = "ANDREA"
dynamic = ["version"]
description = "Platform for aggregated network discovery, simulation, inference, and benchmarking workflows."
authors = [
    { name = "Adrian Segura Ortiz", email = "adrianseor.99@uma.es" },
    { name = "George K. Georgakilas", email = "ggeorgakilas@athenarc.gr" },
    { name = "Theodore Dalamagas", email = "dalamag@athenarc.gr" },
    { name = "Jose F. Aldana-Montes", email = "jfaldana@uma.es" },
]
maintainers = [{ name = "Adrian Segura Ortiz", email = "adrianseor.99@uma.es" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13,<3.14"
keywords = [
    "gene regulatory networks",
    "GRN inference",
    "benchmarking",
    "single-cell",
    "systems biology",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "typer>=0.23.1,<0.24.0",
    "rich>=15.0.0,<16.0.0",
    "docker>=7.1.0,<8.0.0",
    "jsonschema>=4.25.0,<5.0.0",
    "pandas>=2.3.0,<3.0.0",
    "ortools>=9.10,<10.0",
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn>=0.34.0,<0.35.0",
    "python-multipart>=0.0.20,<0.0.21",
    "aiofiles>=24.1.0,<25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "httpx>=0.28.0,<0.29.0",
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
]
release = [
    "build>=1.2.0,<2.0.0",
    "twine>=6.0.0,<7.0.0",
]

[project.urls]
Homepage = "https://github.com/AdrianSeguraOrtiz/ANDREA"
Repository = "https://github.com/AdrianSeguraOrtiz/ANDREA"
Issues = "https://github.com/AdrianSeguraOrtiz/ANDREA/issues"
Documentation = "https://github.com/AdrianSeguraOrtiz/ANDREA/tree/main/docs"

[project.scripts]
andrea = "andrea.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["andrea*"]

[tool.setuptools.dynamic]
version = { attr = "andrea.config.__version__" }

[tool.setuptools.package-data]
"andrea.catalog_inference_tools" = [
    "schemas/*",
    "schemas/**/*",
    "input_specs/*",
    "input_specs/**/*",
    "tools/*",
    "tools/**/*",
]
"andrea.gui.common" = [
    "static/*",
    "static/**/*",
]
"andrea.gui.infer_network" = [
    "static/*",
    "static/**/*",
]
"andrea.catalog_simulation_data_tools" = [
    "schemas/*",
    "schemas/**/*",
    "input_specs/*",
    "input_specs/**/*",
    "simulators/*",
    "simulators/**/*",
]
"andrea.gui.generate_data" = [
    "static/*",
    "static/**/*",
]
"andrea.gui.evaluate_inference" = [
    "static/*",
    "static/**/*",
]
"andrea.gui.compare_networks" = [
    "static/*",
    "static/**/*",
]
"andrea.core.commands.evaluate_inference.view_assets" = [
    "*.html",
    "*.css",
    "*.js",
]
"andrea.core.commands.compare_networks.view_assets" = [
    "*.html",
    "*.css",
    "*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"
