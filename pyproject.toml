[project]
name = "ANDREA"
version = "0.1.0"
description = "Platform for aggregated network discovery, simulation, inference, and benchmarking workflows."
authors = [{ name = "Adrian Segura Ortiz", email = "adrianseor.99@uma.es" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "typer[all]>=0.23.1,<0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
]

[project.scripts]
andrea = "andrea.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["andrea*"]

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"
